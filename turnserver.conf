# TURN server configuration
listening-port=3478
tls-listening-port=5349

# Relay ports
min-port=49152
max-port=65535

# Authentication
lt-cred-mech
user=swiftconnect:swiftconnect-password

# Realm
realm=swiftconnect.io

# Logging
log-file=/var/log/turnserver/turnserver.log
verbose

# Performance
total-quota=100
bps-capacity=0
stale-nonce

# Security
no-multicast-peers
